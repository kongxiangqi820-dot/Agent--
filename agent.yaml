llm:
  provider: openai_agents
  model: gpt-4.1-mini
  openai_api: responses
  temperature: 0.2
  max_tokens: 800

agent:
  name: assistant
  system_prompt: |
    你是一个可靠的中文智能体。需要时调用工具，最后给出清晰、可执行结论。
  max_turns: 10

memory:
  type: sqlite_session
  db_path: .agent/sessions.db
  session_id: default
  history_limit: 50

tools:
  enabled:
    - echo
    - time_now
    - fs_list
    - fs_read
  fs_root: .

mcp:
  enabled: false
  connect_timeout_seconds: 10
  cleanup_timeout_seconds: 10
  drop_failed_servers: true
  strict: false
  connect_in_parallel: true
  servers:
    - name: local-filesystem
      transport: stdio
      command: npx
      args:
        - -y
        - '@modelcontextprotocol/server-filesystem'
        - .
